name: Nightly prices

on:
  schedule:
    - cron: "35 21 * * 1-5"   # 21:35 UTC on weekdays, after the US close
  workflow_dispatch:           # adds a "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download prices
        run: python3 update.py
        env:
          AV_KEY: ${{ secrets.AV_KEY }}
      - name: Save prices to the site
        run: |
          git config user.name "hayridge-bot"
          git config user.email "hayridge-bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || git commit -m "Nightly prices"
          git push
