<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Monaco Gallery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap">
<style>
  /* Layout: a wide bright sky fills the screen, Monaco sits small along the bottom edge,
     the quote hangs near the top and the painting is pinned to the exact centre. */
  :root {
    --sky-top: #3f8fdc;
    --sky-low: #cfe8fa;
    --ink: #1c2230;
    --shadow: rgba(20, 40, 70, 0.35);
    --quote: 'Caveat', 'Bradley Hand', 'Segoe Print', cursive;
    color-scheme: light;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--sky-low);
    overflow: hidden;
  }
  #scene {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
    background: linear-gradient(var(--sky-top), var(--sky-low));
  }
  /* The painting is pinned to the exact centre; the quote lives in the top-right corner
     and shrinks itself (see fitQuote) whenever it would touch the painting. */
  .painting {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    display: block;
    max-width: min(calc(100vw - 64px), 400px);
    max-height: 54vh;
    max-height: 54dvh;
    width: auto;
    height: auto;
    box-shadow: 0 30px 60px -12px var(--shadow), 0 8px 20px rgba(20, 40, 70, 0.18);
  }
  .quote {
    position: fixed;
    top: calc(env(safe-area-inset-top, 0px) + max(14px, 3vh));
    right: max(18px, 3.5vw);
    z-index: 2;
    max-width: min(24ch, calc(100vw - 36px));
    margin: 0;
    text-align: right;
    text-wrap: balance;
    font-family: var(--quote);
    font-style: normal;
    font-weight: 600;
    font-size: clamp(16px, 1.7vw, 20px);
    line-height: 1.15;
    letter-spacing: 0.015em;
    color: var(--ink);
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.9), 0 0 2px rgba(255, 255, 255, 0.9);
    transform: rotate(-1.5deg);
    transform-origin: right top;
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>
<p class="quote" id="quote">&ldquo;Regret is usually a waste of time, as is gloating.&rdquo;</p>
<img class="painting" id="painting" src="painting.jpg" alt="The painting">

<script>
(function () {
  const cv = document.getElementById('scene');
  const ctx = cv.getContext('2d');

  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  function draw() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const W = window.innerWidth, H = window.innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const R = rng(4417);
    const sea = H * 0.925;               // waterline, close to the bottom
    const k = Math.max(0.55, Math.min(W / 1400, 1.2)); // scale for small details

    // Bright clear sky
    let g = ctx.createLinearGradient(0, 0, 0, sea);
    g.addColorStop(0, '#3a88d6');
    g.addColorStop(0.45, '#7db8ec');
    g.addColorStop(0.8, '#bfe0f8');
    g.addColorStop(1, '#e4f2fc');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, sea);

    // Sun glare, top right
    const sx = W * 0.85, sy = H * 0.1;
    g = ctx.createRadialGradient(sx, sy, 0, sx, sy, Math.max(W, H) * 0.5);
    g.addColorStop(0, 'rgba(255,255,245,0.55)');
    g.addColorStop(1, 'rgba(255,255,245,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, sea);

    // A few soft fair-weather clouds
    function cloud(cx, cy, size) {
      for (let i = 0; i < 9; i++) {
        const ox = (R() - 0.5) * size * 2.2;
        const oy = (R() - 0.5) * size * 0.35;
        const r = size * (0.35 + R() * 0.45);
        const cg = ctx.createRadialGradient(cx + ox, cy + oy, 0, cx + ox, cy + oy, r);
        cg.addColorStop(0, 'rgba(255,255,255,0.75)');
        cg.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = cg;
        ctx.beginPath(); ctx.ellipse(cx + ox, cy + oy, r * 1.4, r * 0.7, 0, 0, Math.PI * 2); ctx.fill();
      }
    }
    cloud(W * 0.12, H * 0.22, Math.min(W, H) * 0.08);
    cloud(W * 0.86, H * 0.38, Math.min(W, H) * 0.06);
    cloud(W * 0.3, H * 0.62, Math.min(W, H) * 0.05);
    cloud(W * 0.72, H * 0.7, Math.min(W, H) * 0.045);

    // Distant hazy mountains behind the town
    function ridge(baseY, amp, color, rough, phase) {
      ctx.fillStyle = color;
      ctx.beginPath(); ctx.moveTo(0, sea);
      const steps = 80;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const shape = Math.sin(t * Math.PI * 1.3 + phase) * 0.6 + Math.sin(t * 9.1 + phase) * 0.12 * rough + Math.sin(t * 23 + phase * 2) * 0.04 * rough;
        ctx.lineTo(t * W, baseY - amp * shape);
      }
      ctx.lineTo(W, sea); ctx.closePath(); ctx.fill();
    }
    ridge(H * 0.84, H * 0.07, '#b3cde3', 1, 0.3);
    ridge(H * 0.875, H * 0.05, '#97b6cc', 1.5, 1.1);
    ridge(H * 0.9, H * 0.025, '#86a596', 2, 2.0);

    // Monte-Carlo: small pale buildings across the bottom
    const palette = ['#f6ead8', '#efdcc2', '#f8f1e4', '#e8cdb3', '#f3dfd2', '#ebe0c9'];
    const rows = 4;
    for (let r = 0; r < rows; r++) {
      const depth = r / (rows - 1);
      const base = H * (0.885 + depth * 0.04);
      let x = W * (0.24 + (1 - depth) * 0.06);
      while (x < W + 10) {
        const bw = (8 + R() * 16) * k * (0.75 + depth * 0.4);
        const tall = R() < 0.15;
        const bh = (tall ? 28 + R() * 30 : 7 + R() * 14) * k * (0.75 + depth * 0.5);
        const top = base - bh;
        ctx.globalAlpha = 0.55 + depth * 0.45;
        ctx.fillStyle = palette[Math.floor(R() * palette.length)];
        ctx.fillRect(x, top, bw, bh);
        ctx.fillStyle = 'rgba(90,110,140,0.18)';
        ctx.fillRect(x + bw * 0.65, top, bw * 0.35, bh);
        if (!tall && R() < 0.45) {
          ctx.fillStyle = '#c8806a';
          ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x + bw / 2, top - bw * 0.2); ctx.lineTo(x + bw, top); ctx.fill();
        }
        // tiny shaded windows
        ctx.fillStyle = 'rgba(70,90,120,0.35)';
        const ws = Math.max(1, 1.4 * k);
        for (let wy = top + ws * 2; wy < base - ws * 2; wy += ws * 3) {
          for (let wx = x + ws; wx < x + bw - ws; wx += ws * 2.8) {
            if (R() < 0.5) ctx.fillRect(wx, wy, ws, ws);
          }
        }
        ctx.globalAlpha = 1;
        x += bw + R() * 3 * k;
      }
      // trees between terraces
      ctx.fillStyle = 'rgba(80,120,90,' + (0.4 + depth * 0.4) + ')';
      for (let i = 0; i < 30; i++) {
        const tx = W * 0.26 + R() * W * 0.74;
        ctx.beginPath(); ctx.arc(tx, base - 1, (2 + R() * 4) * k, 0, Math.PI * 2); ctx.fill();
      }
    }

    // The Rock with the Prince's Palace, far left
    ctx.fillStyle = '#6f8478';
    ctx.beginPath();
    ctx.moveTo(0, sea);
    ctx.lineTo(0, H * 0.888);
    ctx.lineTo(W * 0.18, H * 0.886);
    ctx.quadraticCurveTo(W * 0.24, H * 0.893, W * 0.26, sea);
    ctx.closePath(); ctx.fill();
    const pw = W * 0.09, ph = H * 0.016, px = W * 0.05, py = H * 0.887 - ph;
    ctx.fillStyle = '#f4e7d0'; ctx.fillRect(px, py, pw, ph);
    ctx.fillStyle = 'rgba(90,110,140,0.2)'; ctx.fillRect(px + pw * 0.7, py, pw * 0.3, ph);
    ctx.fillStyle = '#f4e7d0';
    ctx.fillRect(px + pw * 0.15, py - ph * 0.9, pw * 0.07, ph * 0.9);
    const fx = px + pw * 0.185, fy = py - ph * 0.9;
    ctx.strokeStyle = '#555'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(fx, fy - 9 * k); ctx.stroke();
    ctx.fillStyle = '#ce1126'; ctx.fillRect(fx, fy - 9 * k, 6 * k, 2 * k);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(fx, fy - 7 * k, 6 * k, 2 * k);

    // Mediterranean along the very bottom
    g = ctx.createLinearGradient(0, sea, 0, H);
    g.addColorStop(0, '#5aa3cf');
    g.addColorStop(1, '#2c78ae');
    ctx.fillStyle = g; ctx.fillRect(0, sea, W, H - sea);
    for (let i = 0; i < 120; i++) {
      ctx.fillStyle = 'rgba(255,255,255,' + (0.15 + R() * 0.35) + ')';
      ctx.fillRect(R() * W, sea + 2 + R() * (H - sea), 4 + R() * 14, 1);
    }

    // Tiny white yachts in the harbour
    const boats = Math.round(W / 40);
    for (let i = 0; i < boats; i++) {
      const bx = W * 0.28 + R() * W * 0.7;
      const by = sea + 2 + R() * (H - sea) * 0.35;
      const L = (R() < 0.25 ? 18 + R() * 16 : 7 + R() * 8) * k;
      const h = L * 0.15;
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(bx, by); ctx.lineTo(bx + L, by); ctx.lineTo(bx + L * 0.9, by + h); ctx.lineTo(bx + L * 0.06, by + h); ctx.closePath(); ctx.fill();
      ctx.fillRect(bx + L * 0.28, by - h, L * 0.4, h);
    }
  }

  let t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(draw, 120); });
  draw();
})();
</script>

<script>
(function () {
  const q = document.getElementById('quote');
  const p = document.getElementById('painting');
  function fitQuote() {
    q.style.fontSize = '';
    let size = parseFloat(getComputedStyle(q).fontSize);
    for (let i = 0; i < 40; i++) {
      const a = q.getBoundingClientRect(), b = p.getBoundingClientRect();
      const gap = 10;
      const touches = a.bottom + gap > b.top && a.top < b.bottom + gap &&
                      a.left < b.right + gap && a.right + gap > b.left;
      if (!touches || size <= 10) break;
      size -= 0.5;
      q.style.fontSize = size + 'px';
    }
  }
  let t;
  window.addEventListener('resize', function () { clearTimeout(t); t = setTimeout(fitQuote, 120); });
  if (p.complete) fitQuote(); else p.addEventListener('load', fitQuote);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitQuote);
  fitQuote();
})();
</script>
</body>
</html>
